<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>یاد و نام کیان پیرفلک</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #111;
    color: #fff;
    font-family: Arial, Tahoma, sans-serif;
}

.container {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    padding: 30px 20px 60px;
    text-align: center;
}

/* عنوان */

h1 {
    font-size: 36px;
    margin: 0 0 25px;
    line-height: 1.5;
}

/* عکس */

.photo-box {
    width: 100%;
    max-width: 430px;
    margin: 0 auto 25px;
    border-radius: 10px;
    overflow: hidden;
    background: #222;
}

.photo-box img {
    display: block;
    width: 100%;
    height: auto;
}

/* اطلاعات */

.info {
    margin-top: 10px;
}

.place {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 8px;
}

.date {
    font-size: 20px;
    color: #aaa;
}

/* عنوان شمارنده */

.timer-title {
    margin-top: 35px;
    margin-bottom: 12px;
    font-size: 19px;
    color: #aaa;
}

/* شمارنده */

.timer {
    font-size: 34px;
    font-weight: bold;
    direction: ltr;
    text-align: center;
    letter-spacing: 2px;
    line-height: 1.5;
    white-space: nowrap;
}

/* شرح حال */

.description {
    margin-top: 35px;
    padding: 22px;
    background: #1b1b1b;
    border-radius: 10px;
    line-height: 2.1;
    font-size: 19px;
    text-align: right;
}

/* عنوان پایانی */

.footer-title {
    margin-top: 35px;
    font-size: 23px;
    font-weight: bold;
}

/* موبایل */

@media (max-width: 600px) {

    .container {
        padding: 25px 15px 45px;
    }

    h1 {
        font-size: 30px;
    }

    .place {
        font-size: 23px;
    }

    .date {
        font-size: 18px;
    }

    .timer-title {
        font-size: 17px;
    }

    .timer {
        font-size: 24px;
        letter-spacing: 1px;
    }

    .description {
        font-size: 17px;
    }

}

</style>
</head>

<body>

<div class="container">

    <h1>کیان پیرفلک</h1>

    <div class="photo-box">
        <img src="کیان.jpg" alt="کیان پیرفلک">
    </div>

    <div class="info">

        <div class="place">
            ایذه
        </div>

        <div class="date">
            ۲۵ آبان ۱۴۰۱
        </div>

    </div>

    <div class="timer-title">
        مدت زمان گذشته
    </div>

    <div id="timer" class="timer">
        0 | 0 | 0 | 0
    </div>

    <div class="description">

        کیان پیرفلک، کودک اهل ایذه،
        در ۲۵ آبان ۱۴۰۱ جان باخت.

        <br><br>

        این صفحه برای یاد و نام او و ثبت زمان سپری‌شده از آن تاریخ ایجاد شده است.

    </div>

    <div class="footer-title">
        یاد و نام کیان پیرفلک
    </div>

</div>

<script>

const martyrdomDate = new Date(2022, 10, 16, 0, 0, 0);

function updateTimer() {

    const now = new Date();

    let totalSeconds = Math.floor(
        (now - martyrdomDate) / 1000
    );

    let days = Math.floor(totalSeconds / 86400);

    totalSeconds %= 86400;

    let hours = Math.floor(totalSeconds / 3600);

    totalSeconds %= 3600;

    let minutes = Math.floor(totalSeconds / 60);

    let seconds = totalSeconds % 60;

    document.getElementById("timer").textContent =
        days + " | " +
        hours + " | " +
        minutes + " | " +
        seconds;
}

updateTimer();

setInterval(updateTimer, 1000);

</script>

</body>
</html>
