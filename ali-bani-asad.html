<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>یاد و نام علی بنی‌اسد</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #111;
        color: #eee;
        font-family: Tahoma, Arial, sans-serif;
        text-align: center;
    }

    .container {
        max-width: 700px;
        margin: 0 auto;
        padding: 30px 20px;
    }

    h1 {
        font-size: 34px;
        margin-bottom: 35px;
        color: #fff;
    }

    /* شمارنده */
    .timer-title {
        font-size: 18px;
        color: #ccc;
        margin-bottom: 18px;
    }

    .timer {
        direction: ltr;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 12px;
        margin: 10px auto 35px;
    }

    .time-box {
        min-width: 85px;
    }

    .number {
        font-size: 38px;
        font-weight: bold;
        color: #d62828;
        line-height: 1.2;
    }

    .label {
        margin-top: 8px;
        font-size: 17px;
        color: #ddd;
    }

    .dash {
        font-size: 34px;
        color: #777;
        line-height: 1.2;
    }

    .description {
        margin-top: 30px;
        padding: 25px 22px;
        background: #181818;
        border-right: 3px solid #d62828;
        border-radius: 8px;
        line-height: 2.2;
        font-size: 18px;
        text-align: right;
        color: #e8e8e8;
    }

    .footer {
        margin-top: 35px;
        padding-bottom: 30px;
        font-size: 18px;
        color: #aaa;
    }

    @media (max-width: 600px) {
        .container {
            padding: 25px 15px;
        }

        h1 {
            font-size: 29px;
        }

        .timer {
            gap: 5px;
        }

        .time-box {
            min-width: 65px;
        }

        .number {
            font-size: 29px;
        }

        .label {
            font-size: 14px;
        }

        .dash {
            font-size: 27px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>یاد و نام علی بنی‌اسد</h1>

    <div class="timer-title">
        ساعات، دقایق و ثانیه‌هایی که از نبودن علی بنی‌اسد گذشت
    </div>

    <div class="timer">

        <div class="time-box">
            <div class="number" id="days">۰</div>
            <div class="label">روز</div>
        </div>

        <div class="dash">-</div>

        <div class="time-box">
            <div class="number" id="hours">۰</div>
            <div class="label">ساعت</div>
        </div>

        <div class="dash">-</div>

        <div class="time-box">
            <div class="number" id="minutes">۰</div>
            <div class="label">دقیقه</div>
        </div>

        <div class="dash">-</div>

        <div class="time-box">
            <div class="number" id="seconds">۰</div>
            <div class="label">ثانیه</div>
        </div>

    </div>

    <div class="description">
        علی بنی‌اسد، جوان ۲۰ ساله اهل اهواز بود.
        <br><br>
        مهر ۱۴۰۱، پیکر او در اهواز کشف و تحویل خانواده شد.
    </div>

    <div class="footer">
        یاد و نام علی بنی‌اسد
    </div>

</div>

<script>

    // تاریخ و ساعت مبنای شمارنده
    //  مهر ۱۴۰۱ - در صورت داشتن ساعت دقیق، این قسمت را اصلاح می‌کنیم
    const startDate = new Date("2022-10-01T00:00:00");

    function persianNumber(number) {
        return number
            .toString()
            .replace(/0/g, "۰")
            .replace(/1/g, "۱")
            .replace(/2/g, "۲")
            .replace(/3/g, "۳")
            .replace(/4/g, "۴")
            .replace(/5/g, "۵")
            .replace(/6/g, "۶")
            .replace(/7/g, "۷")
            .replace(/8/g, "۸")
            .replace(/9/g, "۹");
    }

    function updateTimer() {

        const now = new Date();

        let difference = now - startDate;

        if (difference < 0) {
            difference = 0;
        }

        const totalSeconds = Math.floor(difference / 1000);

        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        document.getElementById("days").textContent =
            persianNumber(days);

        document.getElementById("hours").textContent =
            persianNumber(hours);

        document.getElementById("minutes").textContent =
            persianNumber(minutes);

        document.getElementById("seconds").textContent =
            persianNumber(seconds);
    }

    updateTimer();

    setInterval(updateTimer, 1000);

</script>

</body>
</html>
