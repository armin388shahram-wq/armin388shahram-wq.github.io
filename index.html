<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>یاد و نام کیان پیرفلک</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.container {
    text-align: center;
}

h1 {
    font-size: 32px;
    margin-bottom: 30px;
}

.timer {
    font-size: 38px;
    font-weight: bold;
    direction: ltr;
    letter-spacing: 2px;
}

.date {
    margin-top: 25px;
    font-size: 20px;
    color: #aaa;
}
</style>
</head>

<body>

<div class="container">

    <h1>کیان پیرفلک</h1>

    <div id="timer" class="timer">
        0 | 0 | 0 | 0
    </div>

    <div class="date">
        از ۲۵ آبان ۱۴۰۱
    </div>

</div>

<script>

const martyrdomDate = new Date(2022, 10, 16, 0, 0, 0);

function updateTimer() {

    const now = new Date();

    let totalSeconds = Math.floor(
        (now - martyrdomDate) / 1000
    );

    let days = Math.floor(totalSeconds / 86400);
    totalSeconds %= 86400;

    let hours = Math.floor(totalSeconds / 3600);
    totalSeconds %= 3600;

    let minutes = Math.floor(totalSeconds / 60);
    let seconds = totalSeconds % 60;

    document.getElementById("timer").textContent =
        days + " | " +
        hours + " | " +
        minutes + " | " +
        seconds;
}

updateTimer();

setInterval(updateTimer, 1000);

</script>

</body>
</html>
