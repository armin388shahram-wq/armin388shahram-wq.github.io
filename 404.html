<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>صفحه پیدا نشد | خون جاری خوزستان</title>

  <meta name="description" content="صفحه مورد نظر پیدا نشد. به آرشیو خون جاری خوزستان بازگردید و یاد و نام جان‌باختگان را دنبال کنید.">

  <meta name="robots" content="noindex, follow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #0b0b0b;
      color: #eeeeee;
      font-family: Tahoma, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 92%;
      max-width: 700px;
      text-align: center;
      padding: 45px 25px;
    }

    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 25px;
    }

    .number {
      font-size: 72px;
      font-weight: bold;
      color: #b51f24;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 28px;
      margin: 10px 0 20px;
      color: #ffffff;
    }

    p {
      font-size: 17px;
      line-height: 2;
      color: #cccccc;
      margin: 0 auto 30px;
      max-width: 580px;
    }

    .button {
      display: inline-block;
      background: #b51f24;
      color: #ffffff;
      text-decoration: none;
      padding: 13px 30px;
      border-radius: 7px;
      font-size: 16px;
      transition: 0.2s;
    }

    .button:hover {
      background: #d12a30;
    }

    .footer {
      margin-top: 45px;
      padding-top: 20px;
      border-top: 1px solid #292929;
      color: #777777;
      font-size: 13px;
      line-height: 2;
    }

    @media (max-width: 600px) {

      .container {
        padding: 35px 18px;
      }

      .logo {
        width: 95px;
        height: 95px;
      }

      .number {
        font-size: 58px;
      }

      h1 {
        font-size: 23px;
      }

      p {
        font-size: 15px;
      }

      .button {
        width: 90%;
        max-width: 300px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <img
      src="logo-khoon-jari-khuzestan.png"
      alt="خون جاری خوزستان"
      class="logo"
    >

    <div class="number">404</div>

    <h1>صفحه مورد نظر پیدا نشد</h1>

    <p>
      شاید این نشانی تغییر کرده باشد یا صفحه مورد نظر دیگر در این آدرس قرار نداشته باشد.
      برای مشاهده آرشیو یاد و نام جان‌باختگان خوزستان به صفحه اصلی پروژه بازگردید.
    </p>

    <a class="button" href="/">
      بازگشت به صفحه اصلی
    </a>

    <div class="footer">
      یاد و نام جان‌باختگان قیام و مقاومت در خوزستان
      <br>
      برای آنکه نام‌ها در هیاهوی زمان گم نشوند.
    </div>

  </main>

</body>
</html>
