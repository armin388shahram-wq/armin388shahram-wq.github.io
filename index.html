<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>یاد و نام کیان پیرفلک</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 30px 20px 50px;
    text-align: center;
}

/* عنوان */

h1 {
    font-size: 34px;
    margin: 10px 0 25px;
}

/* جای عکس */

.photo-box {
    width: 100%;
    max-width: 420px;
    aspect-ratio: 4 / 5;
    margin: 0 auto 25px;
    background: #222;
    border: 1px solid #444;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    font-size: 18px;overflow: hidden;
.photo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* اطلاعات */

.info {
    margin: 15px 0;
}

.place {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 8px;
}

.date {
    font-size: 19px;
    color: #aaa;
}

/* شمارنده */

.timer-title {
    margin-top: 35px;
    margin-bottom: 12px;
    font-size: 18px;
    color: #aaa;
}

.timer {
    font-size: 30px;
    font-weight: bold;
    direction: ltr;
    letter-spacing: 1px;
    line-height: 1.6;
}

/* توضیحات */

.description {
    margin-top: 35px;
    padding: 20px;
    background: #1b1b1b;
    border-radius: 8px;
    line-height: 2;
    font-size: 18px;
    text-align: right;
}

/* عنوان پایانی */

.footer-title {
    margin-top: 35px;
    font-size: 22px;
    font-weight: bold;
}

@media (max-width: 600px) {

    .container {
        padding: 25px 15px 40px;
    }

    h1 {
        font-size: 29px;
    }

    .place {
        font-size: 22px;
    }

    .timer {
        font-size: 24px;
    }

    .description {
        font-size: 16px;
    }

}

</style>
</head>

<body>
<div class="photo-box">
    <img src="کیان.jpg" alt="کیان پیرفلک">
</div>

    <div class="info">

        <div class="place">
            ایذه
        </div>

        <div class="date">
            ۲۵ آبان ۱۴۰۱
        </div>

    </div>

    <div class="timer-title">
        مدت زمان گذشته
    </div>

    <div id="timer" class="timer">
        0 | 0 | 0 | 0
    </div>

    <div class="description">

        کیان پیرفلک، کودک اهل ایذه،
        در ۲۵ آبان ۱۴۰۱ جان باخت.

        <br><br>

        این صفحه برای یاد و نام او و ثبت زمان سپری‌شده از آن تاریخ ایجاد شده است.

    </div>

    <div class="footer-title">
        یاد و نام کیان پیرفلک
    </div>

</div>

<script>

const martyrdomDate = new Date(2022, 10, 16, 0, 0, 0);

function updateTimer() {

    const now = new Date();

    let totalSeconds = Math.floor(
        (now - martyrdomDate) / 1000
    );

    let days = Math.floor(totalSeconds / 86400);

    totalSeconds %= 86400;

    let hours = Math.floor(totalSeconds / 3600);

    totalSeconds %= 3600;

    let minutes = Math.floor(totalSeconds / 60);

    let seconds = totalSeconds % 60;

    document.getElementById("timer").textContent =
        days + " | " +
        hours + " | " +
        minutes + " | " +
        seconds;
}

updateTimer();

setInterval(updateTimer, 1000);

</script>

</body>
</html>
